# Originally auto-generated by `firebase init hosting:github`
# (https://github.com/firebase/firebase-tools), then adapted to this repo's
# build step and action-pinning conventions — the stock version deployed
# straight from checkout with no build, so `apps/landing-page/dist` (what
# firebase.json actually serves) never existed.

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - 'apps/landing-page/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-pull-request.yml'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing page
        run: pnpm --filter @notion-ub/landing-page build

      # Without `target`, firebase.json's two sites both deploy, and
      # notion-ub-assets fails because apps/glasses/dist-model is not built
      # here (that site is published only by deploy-voice-model.yml).
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOFSDEV }}
          target: notion-ub-landing
          projectId: hofsdev
