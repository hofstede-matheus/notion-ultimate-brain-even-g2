name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['apps/glasses--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/glasses--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The .ehpk build is chained here rather than triggered by the tag push: tags
  # pushed with the default GITHUB_TOKEN do not start new workflow runs, so a
  # `on: push: tags` build would silently never fire.
  build-ehpk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-ehpk.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
